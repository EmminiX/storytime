<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141c" media="(prefers-color-scheme: dark)">
<title>Storytime</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/cover.png">
<link rel="icon" href="/cover.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<style>
/* ---------- tokens ---------- */
:root{
  color-scheme:light dark;
  --paper:#f3eee4;--panel:#fbf8f1;--ink:#1e2733;--muted:#5a6474;--line:#dbd3c6;
  --accent:#e6a63d;--accent-ink:#8a5410;--accent-soft:#f8e7c4;--ring:#c98a2a;
  --night:#121b33;
  --ease:cubic-bezier(.22,1,.36,1);
  --radius:28px;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0f141c;--panel:#182029;--ink:#eef1f5;--muted:#a9b3c1;--line:#2c3542;
    --accent:#e9b25a;--accent-ink:#f2c472;--accent-soft:#3a2d16;--ring:#e9b25a}
  html:not(.sleeping) body{background:radial-gradient(1100px 520px at 50% -120px,#1a2540 0%,var(--paper) 72%)}
}
/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.5 Lexend,system-ui,sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden;transition:background-color 2s var(--ease),color 2s var(--ease)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0;touch-action:manipulation}
button:disabled{cursor:wait}
:focus-visible{outline:3px solid var(--ring);outline-offset:4px}
h1:focus,h2:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.no-motion *,.no-motion *::before,.no-motion *::after{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;max-width:1040px;margin:0 auto;padding:10px 32px 0;padding-top:max(10px,env(safe-area-inset-top));min-height:76px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;letter-spacing:.01em}
.brand svg{width:30px;height:30px}
.tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:10px;min-height:76px;padding:0 24px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);font-weight:500;font-size:17px;white-space:nowrap;transition:border-color .2s var(--ease),background-color .2s var(--ease)}
.pill svg{width:22px;height:22px}
.pill:hover{border-color:var(--ring)}
.switch .track{position:relative;width:48px;height:28px;border-radius:999px;background:var(--line);transition:background-color .3s var(--ease)}
.switch .track::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .track::after{transform:translateX(20px)}
.switch b{font-weight:600;color:var(--accent-ink)}

/* ---------- screens ---------- */
main{max-width:1040px;margin:0 auto;padding:10px 32px 200px}
.screen{animation:fade .5s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes rise-svg{from{transform:translateY(14px)}to{transform:none}}

/* ---------- the scene ---------- */
.scene-slot{position:relative;height:clamp(230px,33vh,420px)}
.scene-slot.band{height:clamp(170px,26vh,320px)}
.scene{position:relative;width:100%;height:100%;border-radius:var(--radius);overflow:hidden;background:var(--night);box-shadow:0 34px 50px -42px rgba(10,15,30,.7)}
.scene.fixed{position:fixed;z-index:40;transition:top .9s var(--ease),left .9s var(--ease),width .9s var(--ease),height .9s var(--ease),border-radius .9s var(--ease)}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .sky{opacity:0;transition:opacity 1.2s var(--ease)}
.scene[data-mood="sleepy"] .sky.night,.scene[data-mood="brave"] .sky.dusk,.scene[data-mood="funny"] .sky.day{opacity:1}
.scene[data-world="sea"] .sky:not(.sea){opacity:0}.scene[data-world="sea"] .sky.sea{opacity:1}
.scene.night .sky:not(.night),.scene[data-world="space"] .sky:not(.night){opacity:0}.scene.night .sky.night,.scene[data-world="space"] .sky.night{opacity:1}
.scene .stars circle{opacity:0;transition:opacity .9s var(--ease)}
.scene[data-mood="sleepy"] .stars circle{opacity:.75}
.scene[data-mood="brave"] .stars circle{opacity:.3}
.scene[data-world="sea"] .stars circle{opacity:0}
.scene[data-world="space"] .stars circle{opacity:.9}
.scene.b3 .stars circle{opacity:.95;transition-delay:calc(var(--i)*45ms)}
.scene.player .stars circle{opacity:.8;transition-delay:0s}
.scene .moon{opacity:0;transform:translateY(60px);transition:opacity 1.2s var(--ease),transform 1.4s var(--ease)}
.scene[data-mood="sleepy"] .moon,.scene.b2 .moon,.scene.player .moon{opacity:1;transform:none}
.scene[data-world="sea"] .moon{opacity:0;transform:translateY(60px)}
.scene[data-world="space"] .moon{opacity:0;transform:translateY(60px)}
.scene .moon .halo{opacity:0;transform:scale(.7);transform-box:fill-box;transform-origin:center;transition:opacity 1.4s var(--ease),transform 1.4s var(--ease)}
.scene.b2 .moon .halo{opacity:.14;transform:none}
.scene.player .moon{transform:translateY(70px)}
.scene .sun{opacity:0;transform:translateY(220px);transition:opacity 1.2s var(--ease),transform 1.4s var(--ease)}
.scene[data-mood="funny"] .sun{opacity:1;transform:none}
.scene[data-mood="brave"] .sun{opacity:1;transform:translateY(130px)}
.scene[data-mood="brave"] .sun circle{fill:#f0973f}
.scene[data-world="sea"] .sun,.scene[data-world="space"] .sun,.scene.night .sun{opacity:0;transform:translateY(300px)}
.scene .clouds{opacity:0;transition:opacity 1s var(--ease)}
.scene[data-mood="funny"]:not(.night):not([data-world="sea"]):not([data-world="space"]):not([data-world="minecraft"]) .clouds{opacity:1}
.scene .world,.scene .friend{opacity:0;transition:opacity .6s var(--ease)}
.scene[data-world="castle"] .w-castle,.scene[data-world="space"] .w-space,.scene[data-world="sea"] .w-sea,.scene[data-world="forest"] .w-forest,
.scene[data-world="minecraft"] .w-minecraft,.scene[data-world="dino"] .w-dino,.scene[data-world="farm"] .w-farm,.scene[data-world="snow"] .w-snow,
.scene[data-friend="puppy"] .f-puppy,.scene[data-friend="robot"] .f-robot,.scene[data-friend="unicorn"] .f-unicorn,.scene[data-friend="fox"] .f-fox,
.scene[data-friend="dragon"] .f-dragon,.scene[data-friend="cat"] .f-cat,.scene[data-friend="owl"] .f-owl,.scene[data-friend="penguin"] .f-penguin{opacity:1;animation:rise-svg .7s var(--ease) both}
.scene .dim{opacity:0;transition:opacity 1.2s var(--ease)}
.scene.player .dim{opacity:.38}
.lantern .glow,.lantern .halo,.lantern .flame{opacity:0;transition:opacity 1.2s var(--ease)}
.lantern .pane{fill:#6a5a44;transition:fill 1.2s var(--ease)}
.scene.b5 .lantern .glow{opacity:.85}.scene.b5 .lantern .halo{opacity:.6}
.scene.b5 .lantern .flame,.scene.player .lantern .flame{opacity:1}
.scene.b5 .lantern .pane,.scene.player .lantern .pane{fill:#f6cf7a}
.scene.player .lantern .glow{opacity:.5}.scene.player .lantern .halo{opacity:.32}
.cstar{opacity:0;transition:opacity .6s var(--ease);transition-delay:calc(var(--i)*110ms)}
.scene.b4 .cstar{opacity:1}
.cline{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1);transition-delay:var(--d)}
.scene.b4 .cline{stroke-dashoffset:0}
.scrim{position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(to top,rgba(6,10,20,.72),rgba(6,10,20,0));opacity:0;transition:opacity .9s var(--ease);pointer-events:none}
.making .scrim{opacity:1}
.caption{position:absolute;left:0;right:0;bottom:12%;padding:0 32px;text-align:center;color:#f3f5f9;opacity:0;transition:opacity .6s var(--ease);pointer-events:none}
.making .caption{opacity:1}
.caption .beat{margin:0;font-size:clamp(20px,2.4vw,26px);font-weight:500;min-height:1.5em;transition:opacity .4s var(--ease)}
.caption .beat.swap{opacity:0}
.caption .made{margin:10px auto 0;max-width:22ch;font-size:clamp(28px,4vw,46px);font-weight:500;line-height:1.2}
.caption .made span{display:inline-block;opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:calc(var(--i)*80ms)}
.scene.b6 .caption .made span{opacity:1;transform:none}
.caption .made-sub{margin:12px 0 0;font-size:19px;opacity:0;transition:opacity .6s var(--ease) 1s;color:#dfe5ee}
.scene.b6 .caption .made-sub{opacity:1}
.caption .bar{display:none;width:min(360px,70%);height:6px;margin:18px auto 0;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.no-motion .caption .bar{display:block}
.caption .bar i{display:block;height:100%;width:0;background:var(--accent)}

/* ---------- chips (the story so far) ---------- */
.chips{position:relative;z-index:2;display:flex;justify-content:center;gap:12px;margin:-40px auto 0;padding:10px 14px;width:max-content;max-width:100%;border-radius:999px;
  background:rgba(251,248,241,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.5);box-shadow:0 18px 34px -24px rgba(10,15,30,.55)}
@media (prefers-color-scheme:dark){.chips{background:rgba(24,32,41,.7);border-color:rgba(255,255,255,.12)}}
.chip{position:relative;width:76px;height:76px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;overflow:hidden;transition:border-color .25s var(--ease),box-shadow .25s var(--ease)}
.chip .pic{width:56px;height:56px;border-radius:50%}
.chip.todo .pic{display:none}
.chip.todo{border-style:dashed}
.chip.todo::after{content:'';width:12px;height:12px;border-radius:50%;background:var(--line)}
.chip[aria-current="step"]{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.chip:hover{border-color:var(--ring)}
html:not(.js) .chips,html:not(.js) .next,html:not(.js) .prev{display:none}

/* ---------- steps ---------- */
.steps{margin-top:26px}
.step{animation:fade .35s var(--ease) both}
.js .step:not(.active){display:none}
.step.leaving{opacity:0;transition:opacity .18s var(--ease)}
.ask{display:grid;grid-template-columns:76px 1fr 76px;align-items:center;gap:16px;margin:0 0 22px}
.ask h2{grid-column:2}
.ask h2,.step>h2{margin:0;text-align:center;font-size:clamp(34px,4.7vw,56px);font-weight:500;line-height:1.15;letter-spacing:-.01em}
.round{width:76px;height:76px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);display:grid;place-items:center;box-shadow:0 10px 22px -16px rgba(10,15,30,.6);transition:border-color .2s var(--ease),background-color .2s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease)}
.round svg{width:32px;height:32px}
.round:hover{border-color:var(--ring)}
.round:active{transform:scale(.96);box-shadow:none;background:var(--accent-soft);border-color:var(--accent)}
.round.next{background:var(--accent);border-color:var(--accent);color:#1e2733}
.round.next:active{background:var(--accent);filter:brightness(.92)}
.ask .spacer{width:76px;height:76px}
.tiles{display:grid;gap:20px;grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.c2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:560px;margin:0 auto}
.tiles.c3{max-width:780px;margin:0 auto}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;min-height:76px;padding:16px 12px 18px;border-radius:24px;background:var(--panel);border:2px solid var(--line);cursor:pointer;text-align:center;font-weight:500;font-size:20px;line-height:1.2;
  transition:border-color .2s var(--ease),box-shadow .25s var(--ease),background-color .25s var(--ease);animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.tile input[type="radio"]{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.tile .pic{width:100%;aspect-ratio:1;max-height:150px;border-radius:16px;transition:transform .35s var(--ease)}
.tile .pic.scene-pic{aspect-ratio:1.18;border-radius:18px}
.tile .minutes{font-size:17px;font-weight:400;color:var(--muted);margin-top:-6px}
.tile:hover{border-color:var(--ring)}
.tile:active .pic{transform:scale(.97)}
.tile:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 18px 30px -24px rgba(10,15,30,.6)}
.tile:has(input:checked) .pic{transform:translateY(-4px)}
.tile:has(input:focus-visible){outline:3px solid var(--ring);outline-offset:4px}
.seal{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .25s var(--ease),transform .25s var(--ease)}
.seal::after{content:'';width:12px;height:6px;border-left:3px solid #1e2733;border-bottom:3px solid #1e2733;transform:translate(0,-2px) rotate(-45deg)}
.tile:has(input:checked) .seal{opacity:1;transform:none}
.tile .own-input{width:100%;min-height:48px;margin-top:4px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--paper);font-size:18px;text-align:center}
.tile .own-input::placeholder{color:var(--muted);opacity:.8}
.tile .own-input:focus{border-color:var(--accent);outline:none}
.tile:has(.own-input:focus){border-color:var(--accent)}
/* ready step */
.ready{max-width:640px;margin:0 auto;text-align:center}
.summary{font-size:22px;line-height:1.5;margin:18px 0 0;color:var(--muted)}
.summary b{color:var(--ink);font-weight:500}
.hero{display:grid;gap:8px;margin:26px auto 0;max-width:420px;text-align:left}
.hero span{font-size:17px;color:var(--muted)}
.hero input{width:100%;height:64px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:18px;padding:12px 18px;font-size:22px}
.make{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:88px;margin-top:26px;border-radius:26px;background:var(--accent);color:#1e2733;font-size:26px;font-weight:600;transition:transform .2s var(--ease),filter .2s var(--ease)}
.make svg{width:30px;height:30px}
.make:hover{filter:brightness(1.04)}
.make:active{transform:scale(.985)}
.make:disabled{opacity:.6}
.shelf-link{display:inline-flex;align-items:center;gap:8px;min-height:56px;margin-top:14px;padding:0 10px;color:var(--accent-ink);font-weight:500;text-decoration:none;border-radius:12px}
.shelf-link svg{width:22px;height:22px}

/* ---------- player ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.count{font-size:17px;color:var(--muted);display:flex;align-items:center;gap:10px}
.count .marks{display:inline-flex;gap:6px}
.count .marks i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.count .marks i.done{background:var(--accent)}
.title{margin:22px 0 4px;text-align:center;font-size:clamp(28px,3.8vw,42px);font-weight:500;line-height:1.2}
.reader{margin:0 0 26px;text-align:center;color:var(--muted);font-size:17px}
.text{max-width:720px;margin:0 auto}
.text p{position:relative;margin:0 0 14px;padding:18px 24px;border-radius:18px;font-size:clamp(20px,2.4vw,26px);line-height:1.7;color:var(--muted);border:2px solid transparent;transition:background-color .6s var(--ease),color .6s var(--ease),border-color .6s var(--ease)}
.text p.active{color:var(--ink);background:var(--accent-soft);border-color:var(--accent)}
.text p.done{opacity:.6}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px max(24px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:linear-gradient(to top,var(--paper) 70%,transparent);box-shadow:0 -14px 34px -26px rgba(10,15,30,.5);transition:opacity 2s var(--ease)}
.dock-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:720px;margin:0 auto;gap:16px}
.playbtn{position:relative;width:112px;height:112px;border-radius:50%;background:var(--accent);color:#1e2733;display:grid;place-items:center;margin:0 auto;transition:transform .2s var(--ease),background-color 2s var(--ease),color 2s var(--ease)}
.playbtn:active{transform:scale(.96)}
.playbtn .icon{width:44px;height:44px;grid-area:1/1}
.playbtn .ring{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);transform:rotate(-90deg);pointer-events:none}
.playbtn .ring circle{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;opacity:.9}
.playbtn .ring .trackc{stroke:var(--line);opacity:.8}
.playbtn .pause{display:none}
.playing .playbtn .play{display:none}.playing .playbtn .pause{display:block}
.stopbtn{justify-self:end;width:76px;height:76px;border-radius:22px;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;gap:2px;font-size:17px;font-weight:500;transition:border-color .2s var(--ease),background-color 2s var(--ease)}
.stopbtn svg{width:24px;height:24px}
.status{margin:0;font-size:17px;color:var(--muted);min-height:1.5em}
.dock .status{justify-self:end;text-align:right}
.status:empty{visibility:hidden}

/* ---------- sleep ---------- */
.sleep-moon{display:none;position:fixed;inset:0;justify-items:center;align-items:start;padding-top:24vh;pointer-events:none;z-index:1}
.sleep-moon svg{width:min(42vw,260px);height:auto;opacity:.5}
.sleeping body{background:#04060a;color:#8a95a6}
.sleeping .top,.sleeping .text,.sleeping .scene-slot,.sleeping .reader,.sleeping .bar .back{visibility:hidden}
.sleeping .scene{opacity:0;transition:opacity 2s var(--ease)}
.sleeping .title{position:fixed;left:24px;right:24px;top:62vh;margin:0;color:#8a95a6;font-size:24px;transition:color 2s var(--ease)}
.sleeping .count{color:#6e7a8b}.sleeping .count .marks i{background:#1b2230}.sleeping .count .marks i.done{background:#6e7a8b}
.sleeping .dock{background:linear-gradient(to top,#04060a 70%,transparent)}
.sleeping .playbtn{background:#141b27;color:#8a95a6}
.sleeping .playbtn .ring circle{stroke:#3a4556}.sleeping .playbtn .ring .trackc{stroke:#141b27}
.sleeping .stopbtn{background:#0a0e15;border-color:#1b2230;color:#6e7a8b}
.sleeping .status{color:#6e7a8b}
.sleeping .sleep-moon{display:grid}
.sleeping .sleep-moon svg{animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.42}50%{transform:scale(1.05);opacity:.62}}

/* ---------- shelf ---------- */
.h{margin:10px 0 22px;font-size:clamp(34px,4.7vw,56px);font-weight:500;line-height:1.15;letter-spacing:-.01em}
.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

.empty{color:var(--muted)}
.pill.small{min-height:36px;padding:0 12px;font-size:15px;gap:6px;border-radius:16px}
.pill.small svg{width:18px;height:18px}
.pill.danger{border-color:#d6604d;color:#d6604d}
.pill.danger:hover{background:#3a1414}
.book-actions{display:flex;gap:6px;align-items:center}
.heart{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;color:var(--muted);transition:color .2s var(--ease),transform .2s var(--ease)}
.heart svg{width:26px;height:26px}
.heart path{fill:transparent;stroke:currentColor;stroke-width:2;stroke-linejoin:round;transition:fill .2s var(--ease)}
.heart[aria-pressed="true"]{color:var(--accent)}
.heart[aria-pressed="true"] path{fill:currentColor}
.heart:active{transform:scale(.94)}
.title-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px 0 4px}
.title-row .title{margin:0}
.sleeping .title-row .heart{visibility:hidden}
.filters{display:flex;gap:10px;margin:0 0 18px}
.filters .pill{min-height:52px;padding:0 20px;font-size:16px}
.filters .pill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.book-actions .pill{margin:0;min-width:44px;min-height:44px;touch-action:manipulation}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .top{padding:8px 20px 0;padding-top:max(8px,env(safe-area-inset-top));gap:10px 12px}
  main{padding:10px 20px 200px}
  .pill{padding:0 16px;gap:8px;min-height:60px;font-size:16px}
  .pill svg{width:20px;height:20px}
}
@media (max-width:700px){
  .top{padding:8px 16px 0;padding-top:max(8px,env(safe-area-inset-top));min-height:64px}
  .brand{font-size:18px}
  .pill{padding:0 14px;min-height:60px;font-size:16px}
  .switch .label{display:none}
  main{padding:8px 16px 190px}
  .scene-slot{height:clamp(200px,30vh,260px)}
  .scene-slot.band{height:180px}
  .chips{gap:4px;padding:6px 8px;margin-top:-30px}
  .chip{width:48px;height:48px}
  .chip .pic{width:36px;height:36px}
  .ask{grid-template-columns:64px 1fr 64px;gap:10px}
  .round,.ask .spacer{width:64px;height:64px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tiles.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tiles.c3 .tile{font-size:17px;padding:12px 8px 14px}
  .tile{font-size:18px;border-radius:20px}
  .tile .pic{max-height:130px}
  .text p{padding:14px 16px}
  .dock-in{grid-template-columns:1fr auto 1fr;gap:10px}
  .skip-controls{gap:4px}
  .skip-label{font-size:13px}
  .skip-btn{width:82px;grid-template-rows:72px auto}
  .skip-btn .disc{width:64px;height:64px}
  .skip-btn.story .disc{width:72px;height:72px}
  .skip-btn svg{width:30px;height:30px}
  .playbtn{width:92px;height:92px}
  .books{grid-template-columns:1fr}
  .book{grid-template-columns:104px 1fr 44px}
  .book .cover{width:104px;height:72px}
}
@media (orientation:landscape) and (min-width:1000px){
  main,.top{max-width:1280px}
  #choose{display:grid;grid-template-columns:minmax(380px,46%) 1fr;gap:36px;align-items:start}
  #choose .left{position:sticky;top:12px}
  .scene-slot{height:clamp(260px,38vh,400px)}
  .chips{margin-top:16px}
  .steps{margin-top:0}
  .tiles{gap:14px}
  .tile{font-size:18px;padding:12px 10px 14px}
  .tile .pic{max-height:120px}
  .ask h2,.step>h2{font-size:clamp(32px,3.4vw,48px)}
}
.hero input{height:76px}
.engine{font-size:17px;color:var(--muted);text-align:center;margin:0 0 8px}



.tile{overflow-wrap:anywhere}
.sleeping .engine{visibility:hidden}
.skip-controls{display:flex;justify-content:center;gap:12px;margin:14px auto 0;max-width:720px}
.skip-btn{display:grid;grid-template-rows:84px auto;justify-items:center;align-items:center;row-gap:6px;width:96px;color:var(--ink);touch-action:manipulation}
.skip-btn .disc{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:var(--panel);border:1.5px solid var(--line);box-shadow:0 10px 22px -16px rgba(10,15,30,.6);transition:border-color .2s var(--ease),background-color .2s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease)}
.skip-btn.story .disc{width:84px;height:84px;color:var(--accent-ink)}
.skip-btn svg{width:34px;height:34px}
.skip-btn:hover .disc{border-color:var(--ring)}
.skip-btn:active .disc{transform:scale(.96);background:var(--accent-soft);border-color:var(--accent);box-shadow:none}
.skip-btn[aria-disabled="true"]{opacity:.4}
.skip-btn[aria-disabled="true"] .disc{box-shadow:none}
.skip-btn[aria-disabled="true"]:hover .disc{border-color:var(--line)}
.skip-btn[aria-disabled="true"]:active .disc{transform:none;background:var(--panel);border-color:var(--line)}
.skip-label{font-size:15px;font-weight:500;line-height:1;color:var(--muted)}
.book{display:grid;grid-template-columns:104px 1fr 44px;align-items:center;gap:16px;min-height:76px;padding:8px 14px 8px 10px;border-radius:18px;background:var(--panel);border:2px solid var(--line);text-align:left;transition:border-color .2s var(--ease),box-shadow .25s var(--ease),transform .2s var(--ease);animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*70ms);width:100%}
.saved-row{position:relative}
.saved-row .book-actions{position:absolute;top:4px;right:64px;z-index:2;justify-content:flex-end}
@media(max-width:700px){.saved-row .book-actions{right:6px}}
.book:hover{border-color:var(--ring);box-shadow:0 18px 30px -24px rgba(10,15,30,.6);transform:translateY(-2px)}
.book .cover{width:104px;height:68px;border-radius:12px;display:block}
.book strong{display:block;font-weight:500;font-size:17px;line-height:1.3}
.book span.when{display:block;color:var(--muted);font-size:16px;margin-top:2px}
.book .go{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#1e2733}
.book .go svg{width:20px;height:20px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}}
@media(max-width:700px){.pill{min-height:76px}.book{grid-template-columns:72px minmax(0,1fr);gap:10px}.book .cover{width:72px;height:60px}.book .go{display:none}.book strong{font-size:16px}.book span.when{font-size:16px}}
@media(orientation:landscape) and (min-width:1000px){.ask h2,.step>h2{font-size:48px}}
</style>

<script>
(() => {
const $ = id => document.getElementById(id);
const html = document.documentElement;
const scene = $('scene'), form = $('choices');
const ORDER = ['who', 'where', 'world', 'friend', 'mood', 'length', 'voice', 'ready'];
const WORLDS = {
  'Dragon castle': {key: 'castle', place: 'the dragon castle', title: 'the Dragon Castle'},
  'Space': {key: 'space', place: 'space', title: 'the Stars'},
  'Under the sea': {key: 'sea', place: 'the deep sea', title: 'the Deep Sea'},
  'Magic forest': {key: 'forest', place: 'the magic forest', title: 'the Magic Forest'},
  'Minecraft world': {key: 'minecraft', place: 'the block world', title: 'the Block World'},
  'Dinosaur island': {key: 'dino', place: 'dinosaur island', title: 'Dinosaur Island'},
  'Farm': {key: 'farm', place: 'the farm', title: 'the Farm'},
  'Snow mountain': {key: 'snow', place: 'the snow mountain', title: 'the Snow Mountain'}
};
const PLACE_PICTURES = {
  'New York City': '<svg class="pic" viewBox="0 0 120 120" aria-hidden="true"><rect x="0" y="0" width="120" height="120" fill="#5a7a9a" rx="20"/><rect x="10" y="80" width="20" height="40" fill="#3a4e80"/><rect x="35" y="70" width="16" height="50" fill="#3a4e80"/><rect x="55" y="65" width="12" height="55" fill="#3a4e80"/><rect x="72" y="75" width="14" height="45" fill="#3a4e80"/><rect x="90" y="80" width="18" height="40" fill="#3a4e80"/></svg>',
  'London': '<svg class="pic" viewBox="0 0 120 120" aria-hidden="true"><rect x="0" y="0" width="120" height="120" fill="#3f6fb5" rx="20"/><rect x="20" y="60" width="80" height="60" fill="#2b3d66"/><rect x="30" y="40" width="12" height="20" fill="#2b3d66"/><rect x="50" y="40" width="12" height="20" fill="#2b3d66"/><rect x="70" y="40" width="12" height="20" fill="#2b3d66"/><rect x="35" y="25" width="50" height="15" fill="#1c2a4a"/><path d="M30 25 L60 10 L90 25" fill="#1c2a4a"/></svg>',
  'Paris': '<svg class="pic" viewBox="0 0 120 120" aria-hidden="true"><rect x="0" y="0" width="120" height="120" fill="#e6a63d" rx="20"/><rect x="45" y="20" width="30" height="80" fill="#3a4e80"/><rect x="40" y="15" width="40" height="10" fill="#2b3d66"/><rect x="35" y="10" width="50" height="5" fill="#1c2a4a"/><circle cx="50" cy="50" r="3" fill="#2a2320"/><circle cx="60" cy="50" r="3" fill="#2a2320"/><circle cx="70" cy="50" r="3" fill="#2a2320"/></svg>',
  'Tokyo': '<svg class="pic" viewBox="0 0 120 120" aria-hidden="true"><rect x="0" y="0" width="120" height="120" fill="#e6a63d" rx="20"/><rect x="20" y="70" width="25" height="50" fill="#3a4e80"/><rect x="50" y="60" width="30" height="60" fill="#3a4e80"/><rect x="85" y="70" width="25" height="50" fill="#3a4e80"/><path d="M20 70 L37 40 L55 70" stroke="#2b3d66" stroke-width="2" fill="none"/><path d="M50 60 L67 30 L85 60" stroke="#2b3d66" stroke-width="2" fill="none"/><path d="M85 70 L102 40 L110 70" stroke="#2b3d66" stroke-width="2" fill="none"/></svg>',
  'Small village': '<svg class="pic" viewBox="0 0 120 120" aria-hidden="true"><rect x="0" y="0" width="120" height="120" fill="#5a7a9a" rx="20"/><path d="M20 80 L40 40 L80 80 L100 40 L120 80" stroke="#fff" stroke-width="4" fill="none"/><circle cx="30" cy="50" r="8" fill="#fff"/><circle cx="90" cy="50" r="8" fill="#fff"/></svg>',
  'Mountain town': '<svg class="pic" viewBox="0 0 120 120" aria-hidden="true"><rect x="0" y="0" width="120" height="120" fill="#5a7a9a" rx="20"/><polygon points="20,80 60,20 100,80" fill="#fff"/><polygon points="40,60 60,40 80,60" fill="#fff"/></svg>',
  'France': '<svg class="pic" viewBox="0 0 120 120" aria-hidden="true"><rect x="0" y="0" width="40" height="120" fill="#3f6fb5"/><rect x="40" y="0" width="40" height="120" fill="#fff"/><rect x="80" y="0" width="40" height="120" fill="#e6a63d"/></svg>',
  'Japan': '<svg class="pic" viewBox="0 0 120 120" aria-hidden="true"><rect x="0" y="0" width="120" height="120" fill="#fff"/><circle cx="60" cy="60" r="30" fill="#e6a63d"/><circle cx="60" cy="60" r="15" fill="#fff"/></svg>',
  'Surprise me': '<svg class="pic" viewBox="0 0 120 120" aria-hidden="true"><rect x="0" y="0" width="120" height="120" fill="#e6a63d" rx="20"/><path d="M60 20 L65 40 L80 45 L70 55 L75 75 L60 65 L45 75 L50 55 L40 45 L55 40 Z" fill="#fff"/><path d="M60 80 Q65 85 70 80 Q65 90 60 85 Q55 90 50 80 Q55 85 60 80" fill="none" stroke="#fff" stroke-width="2"/></svg>'
};
const PLACE_PHRASES = {
  'New York City': 'New York City',
  'London': 'London',
  'Paris': 'Paris',
  'Tokyo': 'Tokyo',
  'Small village': 'a small village',
  'Mountain town': 'a mountain town',
  'France': 'France',
  'Japan': 'Japan',
  'Surprise me': 'a magical place'
};
const FRIENDS = {Puppy: 'puppy', Robot: 'robot', Unicorn: 'unicorn', Fox: 'fox', 'Tiny dragon': 'dragon', Cat: 'cat', Owl: 'owl', Penguin: 'penguin'};
const MOODS = {Funny: 'funny', 'Brave adventure': 'brave', 'Calm and sleepy': 'sleepy'};
const LENGTHS = {Short: 'short', Medium: 'medium', Long: 'long'};
const VOICES = {bf_emma: 'Emma', bm_george: 'George'};
const LISTENERS = new Map();
let listeners = [];
function listenerHero(who) { return ['Both', 'Everyone'].includes(who) ? listeners.map(item => item.name).join(' and ') : who; }
async function loadListeners() {
  try {
    const config = await request('/api/config');
    listeners = config.listeners;
    const names = listeners.map(item => item.name);
    if (names.length >= 2) names.push(names.length === 2 ? 'Both' : 'Everyone');
    $('listeners').replaceChildren(...names.map((name, index) => {
      LISTENERS.set(name, index < listeners.length ? (listeners[index].picture || 'portrait-' + (index % 2)) : 'group');
      const label = document.createElement('label'); label.className = 'tile'; label.style.setProperty('--i', index);
      const input = document.createElement('input');
      input.type = 'radio'; input.name = 'who'; input.value = name; input.checked = index === 0;
      label.innerHTML = pic('who', name) + '<span class="seal"></span>';
      label.prepend(input); label.insertBefore(document.createTextNode(name), label.lastChild);
      return label;
    }));
    $('hero').value = listenerHero(names[0]).slice(0, 60);
    $('make').disabled = false; updateScene(); renderChips();
  } catch { $('make-status').textContent = 'Listeners could not be loaded. Please reload the page.'; }
}
const friendWord = v => v.toLowerCase();

/* ---------- motion switch ---------- */
let motion = true;
function readMotion() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
  try { const v = localStorage.getItem('storytime.motion'); if (v !== null) return v === 'on'; } catch { /* storage blocked: fall through */ }
  return !matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function applyMotion(on) {
  on = on && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  motion = on; html.classList.toggle('no-motion', !on);
  $('motion').setAttribute('aria-checked', String(on)); $('motion-state').textContent = on ? 'on' : 'off';
}
applyMotion(readMotion());
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', () => applyMotion(readMotion()));
$('motion').addEventListener('click', () => {
  applyMotion(!motion);
  try { localStorage.setItem('storytime.motion', motion ? 'on' : 'off'); } catch { /* storage blocked: the switch still works for this visit */ }
});

/* ---------- pictures (one drawing, reused everywhere) ---------- */
const SKY_FOR = {castle: 'dusk', space: 'night', sea: 'sea', forest: 'dusk', minecraft: 'day', dino: 'dusk', farm: 'day', snow: 'night'};
function worldPic(key, cls = 'pic') {
  return `<svg class="${cls}" viewBox="300 60 400 340" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect x="300" y="-600" width="400" height="1020" fill="url(#g-${SKY_FOR[key]})"/><use href="#bg-${key}"/></svg>`;
}
function pic(group, value) {
  if (group === 'world') return worldPic(WORLDS[value].key);
  if (group === 'where') return PLACE_PICTURES[value] || '<svg class="pic" viewBox="0 0 120 120" aria-hidden="true"><rect x="0" y="0" width="120" height="120" fill="#e6a63d" rx="20"/></svg>';
  const id = {who: 'l-' + (LISTENERS.get(value) || 'group'), friend: 'f-' + FRIENDS[value], mood: 'm-' + MOODS[value], length: 'b-' + LENGTHS[value], voice: 'v-' + (value === 'bm_george' ? 'george' : 'emma')}[group];
  return `<svg class="pic" viewBox="0 0 120 120" aria-hidden="true"><use href="#${id}"/></svg>`;
}
function cover(c) {
  const w = WORLDS[c.world].key;
  const placeKey = {'New York City': 'city', 'London': 'castle', 'Paris': 'tower', 'Tokyo': 'pagoda', 'Small village': 'village', 'Mountain town': 'mountain', 'France': 'france', 'Japan': 'japan', 'Surprise me': 'surprise'}[c.where] || 'city';
  return `<svg class="cover" viewBox="200 40 600 380" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect x="0" y="-600" width="1000" height="1020" fill="url(#g-night)"/><use href="#bg-${w}"/><use href="#f-${FRIENDS[c.friend]}" transform="translate(330 262)"/><use href="#p-${placeKey}" transform="translate(800 320) scale(0.3)"/></svg>`;
}

/* ---------- choices and the scene ---------- */
function choices() {
  const c = Object.fromEntries(new FormData(form));
  if (c.where === '__own') c.where = $('own-place').value.trim().slice(0, 60) || 'Surprise me';
  return c;
}
function updateScene(c = choices()) {
  scene.dataset.world = WORLDS[c.world].key; scene.dataset.friend = FRIENDS[c.friend]; scene.dataset.mood = MOODS[c.mood];
}
const LABEL = {who: 'Listening', where: 'Where', world: 'World', friend: 'Friend', mood: 'Feeling', length: 'Length', voice: 'Reader'};
let stepIndex = 0;
function renderChips() {
  const c = choices();
  $('chips').replaceChildren(...ORDER.slice(0, 7).map((g, i) => {
    const done = i <= stepIndex || stepIndex === 7;
    const cur = i === stepIndex ? ' aria-current="step"' : '';
    const word = g === 'voice' ? VOICES[c.voice] : c[g];
    const button = document.createElement('button'); button.type = 'button'; button.className = 'chip' + (done ? '' : ' todo'); button.dataset.go = i;
    if (cur) button.setAttribute('aria-current', 'step');
    button.innerHTML = (done ? pic(g, c[g]) : '') + '<span class="sr"></span>';
    button.querySelector('.sr').textContent = `${LABEL[g]}: ${done ? word : 'not chosen yet'}`;
    return button;
  }));
}
function heroName(c) { return (c.hero || '').trim() || listenerHero(c.who); }
function renderSummary() {
  const c = choices(), s = $('summary');
  s.replaceChildren();
  const add = (t, b) => { const n = document.createElement(b ? 'b' : 'span'); n.textContent = t; s.append(n); };
  const place = c.where ? (PLACE_PHRASES[c.where] || c.where) : 'a magical place';
  add('A '); add(MOODS[c.mood] === 'sleepy' ? 'sleepy' : MOODS[c.mood], 1); add(' story for '); add(listenerHero(c.who), 1);
  add(': in '); add(place, 1); add(' at '); add(WORLDS[c.world].place, 1); add(' with a '); add(friendWord(c.friend), 1); add(', read by '); add(VOICES[c.voice], 1); add('. ');
  add({short: '3 to 4 minutes.', medium: '5 to 6 minutes.', long: '6 to 9 minutes.'}[LENGTHS[c.length]]);
}
const steps = [...form.querySelectorAll('.step')];
function goTo(i) {
  i = Math.max(0, Math.min(ORDER.length - 1, i));
  const from = steps[stepIndex], to = steps[i];
  stepIndex = i;
  const swap = () => {
    from.classList.remove('active', 'leaving'); to.classList.add('active');
    renderChips(); if (ORDER[i] === 'ready') renderSummary();
    window.scrollTo({top: 0, behavior: motion ? 'smooth' : 'auto'});
    to.querySelector('h2').setAttribute('tabindex', '-1'); to.querySelector('h2').focus({preventScroll: true});
  };
  if (from === to) { swap(); return; }
  if (motion) { from.classList.add('leaving'); setTimeout(swap, 180); } else swap();
}
let advance;
form.addEventListener('change', e => {
  if (e.target.name === 'hero') return;
  if (e.target.name === 'who') $('hero').value = listenerHero(e.target.value).slice(0, 60);
  updateScene(); renderChips();
  if (e.target.name === ORDER[stepIndex]) {
    if (e.target.name === 'where' && e.target.value === '__own') { $('own-place').focus(); return; }
    clearTimeout(advance); advance = setTimeout(() => goTo(stepIndex + 1), motion ? 520 : 150);
  }
});
$('own-place').addEventListener('input', () => {
  const radio = form.querySelector('input[name="where"][value="__own"]');
  if (!radio.checked) { radio.checked = true; updateScene(); }
  renderChips();
});
form.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.classList.contains('next')) { clearTimeout(advance); goTo(stepIndex + 1); }
  if (b.classList.contains('prev')) { clearTimeout(advance); goTo(stepIndex - 1); }
});
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { clearTimeout(advance); goTo(+b.dataset.go); } });

/* ---------- moving the scene between screens (the camera moves, no cut) ---------- */
let moveTimer;
function sceneTo(target) {
  clearTimeout(moveTimer);
  const settle = () => {
    if (target !== 'full') { target.append(scene); scene.classList.remove('fixed'); scene.style.cssText = ''; }
  };
  const a = scene.getBoundingClientRect();
  if (!motion || !a.width) {
    if (target === 'full') { document.body.append(scene); scene.classList.add('fixed'); scene.style.cssText = 'top:0;left:0;width:100%;height:100%;border-radius:0'; }
    else settle();
    return;
  }
  document.body.append(scene); scene.classList.add('fixed');
  scene.style.cssText = `transition:none;top:${a.top}px;left:${a.left}px;width:${a.width}px;height:${a.height}px`;
  scene.getBoundingClientRect();
  scene.style.transition = '';
  const b = target === 'full' ? {top: 0, left: 0, width: innerWidth, height: innerHeight} : target.getBoundingClientRect();
  Object.assign(scene.style, {top: b.top + 'px', left: b.left + 'px', width: b.width + 'px', height: b.height + 'px', borderRadius: target === 'full' ? '0' : ''});
  moveTimer = setTimeout(settle, 950);
}

/* ---------- the stars spell the hero's initial ---------- */
const LETTERS = {A:[[[0,4],[0,1],[1,0],[2,1],[2,4]],[[0,2],[2,2]]],B:[[[0,0],[0,4],[1.5,4],[2,3],[1.5,2],[0,2]],[[1.5,2],[2,1],[1.5,0],[0,0]]],C:[[[2,.5],[1.5,0],[.5,0],[0,.5],[0,3.5],[.5,4],[1.5,4],[2,3.5]]],

    const next = await request(`/api/story/${story.next_story_id}`);
    if (token !== session) return;
    history.push(current); openStory(next, true);
  } catch { if (token === session) say('The next story needs a moment…'); }
  finally { nextBusy = false; }
}
async function previousStory() {
  if (history.length) { openStory(history.pop(), true); return; }
  if (story?.prev_story_id) {
    const token = session;
    try {
      const previous = await request(`/api/story/${story.prev_story_id}`);
      if (token === session) openStory(previous, true);
    } catch { if (token === session) say('The story before needs a moment…'); }
    return;
  }
  stop(); resume();
  if (!story?.audio_error) say('The first story, from the start.');
}
async function advanceStory() {
  if (!story || !waiting || !wantsPlay || paragraph < story.total) return;
  if (story.classic || (story.number || 1) >= 3) {
    wantsPlay = false; waiting = false; finished = true; playerLabel(); clearTimeout(sleepTimer); highlight(); ring(1); say('Goodnight.'); return;
  }
  if (!story.next_story_id) { say(story.continuation_error || 'Getting your next story ready…'); return; }
  await nextStory();
}
function pollPending() {
  return Boolean(story) && !finished && !story.audio_error && Boolean($('play')) && !$('play').hidden &&
    (!story.paragraphs?.length || (waiting && paragraph < story.total) ||
     (!story.classic && (story.number || 1) < 3 && !story.next_story_id && !story.continuation_error));
}
async function poll() {
  if (!pollPending() || pollBusy) return;
  pollBusy = true;
  const token = session, id = story.id;
  try {
    const updated = await request(`/api/story/${id}`);
    if (token !== session || story.id !== id) return;
    const needsText = !story.paragraphs.length;
    story = updated;
    for (const url of [story.continuous, ...(story.playlist || []), ...(story.audio || [])]) if (url) badAudio.delete(url); // a fresh snapshot only lists files that exist
    if (story.audio_error) { wantsPlay = false; waiting = false; audio.pause(); playerLabel(); wake(); say(story.audio_error); }
    if (needsText) render(); else { highlight(); updateSkip(); }
    if (!continuous && story.continuous && !badAudio.has(story.continuous) && story.paragraph_starts?.length && !story.audio_error && paragraph < story.total) {
      const position = story.paragraph_starts[paragraph] + (waiting ? 0 : audio.currentTime);
      const handoverSession = ++session;
      switching = true; waiting = true; continuous = true; audio.src = story.continuous;
      audio.addEventListener('loadedmetadata', () => {
        if (handoverSession !== session) return;
        audio.currentTime = Math.min(position, audio.duration);
        switching = false; waiting = false;
        if (wantsPlay) resume();
      }, {once: true});
    }
    if (waiting && wantsPlay && !switching) {
      if (paragraph < story.total) playParagraph();
      else await advanceStory();
    }
  } catch { if (token === session) say('The connection needs a moment…'); }
  finally { pollBusy = false; }
}
if ('mediaSession' in navigator) {
  const actions = {play:resume, pause, nexttrack:nextStory, previoustrack:previousStory};
  for (const [action, handler] of Object.entries(actions)) {
    try { navigator.mediaSession.setActionHandler(action, handler); } catch { /* This browser does not expose this control. */ }
  }
}
$('playbtn').addEventListener('click', () => wantsPlay ? pause() : resume());
$('stop').addEventListener('click', stop);
const COLLECTIONS = {
  shelf: {heading: 'shelf-h', render: renderShelf},
  classics: {heading: 'classics-h', render: renderClassics},
  archive: {heading: 'archive-h', render: renderArchive}
};
function goCollection(id) {
  clearTimeout(advance); session++; stop(); story = null; history.length = 0;
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
  clearTimeout(moveTimer); scene.classList.remove('night', 'player', 'fixed'); scene.style.cssText = ''; $('slot-choose').append(scene);
  show(id); COLLECTIONS[id].render();
  const heading = $(COLLECTIONS[id].heading);
  heading.setAttribute('tabindex', '-1'); heading.focus({preventScroll: true});
}
$('back').addEventListener('click', () => {
  clearTimeout(advance); session++; stop(); story = null; history.length = 0;
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
  if (cameFrom === 'choose') {
    scene.classList.remove('night', 'player'); show('choose'); updateScene(); goTo(0); sceneTo($('slot-choose')); renderShelf(); checkDailyCap();
  } else {
    goCollection(cameFrom);
  }
  $('back').blur();
});
$('to-shelf').addEventListener('click', () => goCollection('shelf'));
$('shelf-back').addEventListener('click', () => { session++; show('choose'); updateScene(); sceneTo($('slot-choose')); });
$('to-classics').addEventListener('click', () => goCollection('classics'));
$('classics-back').addEventListener('click', () => { session++; show('choose'); updateScene(); sceneTo($('slot-choose')); });
$('to-archive').addEventListener('click', () => goCollection('archive'));
$('archive-back').addEventListener('click', () => { session++; show('choose'); updateScene(); sceneTo($('slot-choose')); });
$('fav').addEventListener('click', () => toggleFavorite(story.id, $('status'), $('fav')));
$('prev-story').addEventListener('click', previousStory);
$('next-story').addEventListener('click', nextStory);
$('prev-paragraph').addEventListener('click', previousParagraph);
$('next-paragraph').addEventListener('click', nextParagraph);
audio.addEventListener('ended', () => {
  if (!wantsPlay) return;
  paragraph = continuous ? story.total : paragraph + 1;
  waiting = true; highlight();
  if (paragraph < story.total) playParagraph(); else advanceStory();
});
audio.addEventListener('timeupdate', () => {
  if (!story) return;
  if (continuous && story.paragraph_starts) {
    const next = Math.max(0, story.paragraph_starts.findLastIndex(start => start <= audio.currentTime));
    if (paragraph !== next) { paragraph = next; highlight(); }
  }
  const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
  ring(continuous ? (duration ? audio.currentTime / duration : 0) : (paragraph + (duration ? audio.currentTime / duration : 0)) / story.total);
  if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && Number.isFinite(audio.duration) && audio.duration > 0) {
    navigator.mediaSession.setPositionState({duration:audio.duration, playbackRate:audio.playbackRate, position:Math.min(audio.currentTime, audio.duration)});
  }
});
audio.addEventListener('play', () => { const wasPlaying = wantsPlay; wantsPlay = true; playerLabel(); if (!wasPlaying) wake(); });
audio.addEventListener('pause', () => { if (!audio.ended && !waiting) { wantsPlay = false; playerLabel(); } });
audio.addEventListener('error', () => {
  if (audio.src) badAudio.add(new URL(audio.src).pathname);
  if (!story || !wantsPlay) return;
  switching = false; waiting = false; pause(); say('The audio could not play. Tap play to try again.');
});
document.addEventListener('pointerdown', () => { if (html.classList.contains('sleeping') || wantsPlay) wake(); });
document.addEventListener('keydown', () => { if (html.classList.contains('sleeping') || wantsPlay) wake(); });
setInterval(poll, 2000);
loadListeners(); renderShelf(); renderClassics(); checkDailyCap();
})();
</script>
